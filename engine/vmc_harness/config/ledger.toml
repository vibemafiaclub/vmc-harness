# ledger·brain 영역 설정 (spec 04·09·11). 형식은 defaults.toml과 같다 — 줄마다 주석 메타.
# defaults.toml에 이미 있는 키(judge.exposures·judge.max_days·judge.false_block_immediate, brain.*)는 여기 두지 않는다.

[judge]
min_interval_h = 20          # unit=h md=no spec=04 measured=no 세션 시작 지연 실행 간격(하루 1회 정도)
revert_scan_commits = 200    # unit=commits md=no spec=04 사람 git revert 감지 때 훑는 최근 커밋 수
min_days = 3                 # unit=days md=no spec=04 measured=no 존속(kept) 최소 시험 기간 — 노출을 하루 만에 채워도 이 기간 전엔 존속 안 함
min_hits = 5                 # unit=count md=no spec=04 measured=no 존속 최소 해당 수(노출) — 프로파일이 judge.exposures를 낮춰도 이 밑으론 존속 안 함
spawn_grace_min = 30         # unit=min md=no spec=04 measured=no 세션 시작 분리 실행이 이 시간 안에 안 끝나면 실패로 기록하고 다시 돌린다

[health]
judge_stall_h = 48           # unit=h md=no spec=04 measured=no 작업 기록은 이어지는데 집계·판정이 이만큼 안 돌면 '학습이 멈췄다' 알림
ledger_stall_h = 48          # unit=h md=no spec=04 measured=no 작업 기록은 이어지는데 이 PC 작업 장부가 이만큼 안 쓰이면 같은 알림

[brain]
bm25_k1 = 1.2                # unit=ratio md=no spec=04 BM25 대체 검색(마피아MCP와 같은 값)
bm25_b = 0.75                # unit=ratio md=no spec=04
link_timeout_s = 60          # unit=s md=no spec=04 link-brain 원격 fetch·push 상한

[selfcheck]
timeout_s = 120              # unit=s md=yes spec=04 measured=no 학습 후보 추출 LLM 상한
max_prompts = 120            # unit=prompts md=no spec=04 measured=no 한 세션에서 LLM에 넘기는 사람 발화 수 상한
prompt_chars = 600           # unit=chars md=no spec=04 발화 하나당 넘기는 길이 상한
pending_sessions = 5         # unit=sessions md=no spec=04 SessionEnd가 없을 때 세션 시작에서 이어 처리할 수
idle_min = 30                # unit=min md=no spec=04 measured=no 이만큼 기록이 멈춘 세션만 끝난 것으로 본다

[why]
recent_days = 30             # unit=days md=no spec=04 그 영역의 최근 자동 변경·요청 밖 변경 범위
max_commits = 20             # unit=commits md=no spec=04 파일 기준 why에서 볼 커밋 수
without_timeout_s = 1800     # unit=s md=yes spec=04 measured=no why --without 재실행 상한

[stale_docs]
max_docs = 400               # unit=docs md=no spec=04 한 번에 검사하는 문서 수 상한
min_missing = 1              # unit=refs md=no spec=04 measured=no 이만큼 경로·심볼이 없으면 '낡았을 수 있음'
