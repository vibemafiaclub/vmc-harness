# bootstrap 영역 설정 (spec 07·08 §구조 지도). 형식은 defaults.toml과 같다 — 줄마다 주석 메타.
# 키 중복은 로드 오류(defaults.toml에 이미 있는 diagnose.top_k·budget_*·bootstrap.max_sessions는 여기 두지 않는다).

[bootstrap]
test_timeout_s = 900          # unit=s md=no spec=07 measured=no — 테스트 기준선 실행 상한(넘으면 "시간 초과"로 기록)
collect_timeout_s = 180       # unit=s md=no spec=07 measured=no — 테스트 수집(수집 오류 확인) 상한
command_timeout_s = 30        # unit=s md=no spec=07 — 기계 사실 읽기 명령 하나의 상한
recheck_days = 7              # unit=days md=no spec=01 — 기계 사실 다시 읽기 간격(P3 "가끔 다시 실행")
convention_min_modules = 3    # unit=modules md=no spec=07 — 같은 구조가 이 수 이상 모듈에서 반복되면 관례
map_llm_batch = 40            # unit=modules md=yes spec=08 — 책임 한 줄 LLM 호출 1회에 넣는 모듈 수
map_timeout_s = 120           # unit=s md=yes spec=08 — 책임 한 줄 LLM 호출 1회 상한
map_model = "haiku"           # unit=name md=yes spec=08
map_llm_workers = 6           # unit=count md=no spec=08 — 책임 한 줄 묶음을 동시에 묻는 수
map_budget_s = 300            # unit=s md=no spec=08 measured=no — 책임 한 줄 전체 상한. 넘으면 남은 묶음은 비워 두고 다음 build가 채운다(모듈 4,481개 PC에서 순차 호출로 수 시간 멈춘 것처럼 보임, 2026-10-23)
max_files = 20000             # unit=files md=no spec=08 — 구조 지도가 훑는 파일 상한(넘으면 잘림 표시)

[diagnose]
model = "opus"                # unit=name md=yes spec=07 — 시니어식 진단 모델
retry = 1                     # unit=count md=no spec=07 — 출력 형식이 안 맞을 때 다시 묻는 횟수
max_prompt_chars = 4000       # unit=chars md=no spec=07 — 진단 참고 자료에 넣는 사람 프롬프트 1건 길이 상한
auto = true                   # unit=bool md=no spec=07 — 정기 재진단(그 기간 첫 세션 시작 때 백그라운드). 예산·세션 상한은 diagnose.budget_*·bootstrap.max_sessions
every = "day"                 # unit=name md=no spec=07 — 재진단 주기: day(하루 1회, 2026-10-23 최수민) | week(월요일부터 한 주)
user_doc_chars = 6000         # unit=chars md=no spec=07 measured=no — 사용자 단위 지침 문서(~/.claude/CLAUDE.md 등) 1개를 진단 참고 자료에 넣는 길이 상한(리포트에는 원문을 싣지 않는다)
user_desc_chars = 120         # unit=chars md=no spec=07 — 리포트·진단 결과에 싣는 스킬 설명 요지 길이 상한
rule_text_max_chars = 300     # unit=chars md=no spec=07 — 진단 제안 rule_text(규칙 문장 하나) 길이 상한. 넘으면 형식 오류로 다시 묻는다

[backtest]
fix_window_days = 14          # unit=days md=no spec=07 — 같은 파일을 고친·되돌린 커밋을 "문제가 된 변경"으로 보는 기간
max_commits = 3000            # unit=commits md=no spec=07 — 백테스트가 읽는 커밋 상한
max_scenes = 50               # unit=scenes md=no spec=07 — 결과에 담는 장면 상한(건수는 전부 센다)

[report]
pdf_timeout_s = 120           # unit=s md=no spec=07
risk_top_modules = 30         # unit=modules md=no spec=07 — 위험 지도에 그리는 모듈 수
scenes_per_card = 3           # unit=scenes md=no spec=07 — 제안 상세 카드에 그리는 "이 장치가 있었다면" 대표 장면 수
risk_table_rows = 10          # unit=modules md=no spec=07 — 본문 위험 표에 싣는 상위 모듈 수(전체 지도는 부록)
